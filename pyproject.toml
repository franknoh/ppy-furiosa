[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ppy-furiosa"
dynamic = ["version"]
description = "Furiosa RNGD dialect and backend for PPy"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["ppy-lang[llvm]>=0.3.1,<0.4"]

[project.entry-points."ppy.plugins"]
furiosa = "ppy_furiosa.plugin:create_plugin"

[project.entry-points."ppy.backends"]
furiosa = "ppy_furiosa.backend:create_backend"

[project.entry-points."ppy.backend-formats"]
furiosa-rust = "furiosa"

[project.scripts]
ppy-furiosa = "ppy_furiosa.cli:main"

[tool.hatch.version]
path = "src/ppy_furiosa/version.py"

[dependency-groups]
dev = ["pytest>=8", "ruff", "pyright", "pylint", "mkdocs", "mkdocs-material", "twine"]

[tool.uv]
constraint-dependencies = ["ppy-lang==0.3.1"]

[tool.ppy.plugins.furiosa]
enabled = true

[tool.ppy.backends.furiosa]
target = "rngd"

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pylint.main]
py-version = "3.12"

[tool.pylint.design]
max-args = 8
max-positional-arguments = 8

[tool.pylint.messages_control]
disable = ["missing-function-docstring", "missing-class-docstring", "too-few-public-methods"]
